name: Python CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run test suite
        run: python -m pytest -q
      - name: Verify 100-feature catalog
        run: python -m scripts.generate_feature_catalog --check
      - name: Compile Python files
        run: python -m compileall -q app
      - name: Check JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/lab.js
          node --check app/static/auth.js
          node --check app/static/banking.js

